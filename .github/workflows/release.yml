name: Build and Publish Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Inject Dynamic Version & Secrets
        shell: bash
        run: |
          CLEAN_VER="${GITHUB_REF_NAME#v}"
          echo "{\"version\": \"$CLEAN_VER\"}" > version.json
          echo "Building version $CLEAN_VER"
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Compile Standalone Executable
        run: |
          pyinstaller --noconsole --onefile `
            --name "Dawn Shipping PDF Auditor" `
            --collect-data tkinterdnd2 `
            --add-data ".env;." `
            --add-data "version.json;." `
            main.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Logistics PDF Auditor ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/LogisticsAuditor.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}